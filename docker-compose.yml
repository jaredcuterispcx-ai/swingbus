# Local / internal smoke run of the production image (see README.md → Production).
# Put DRIVER_PASSWORD, ADMIN_PASSWORD and AUTH_SECRET (and optionally PUBLIC_URL)
# in .env (gitignored), then:
#   docker compose up --build        # http://localhost:3000

services:
  swing-bus:
    build: .
    image: swing-bus:local
    ports:
      - "3000:3000"
    environment:
      DRIVER_PASSWORD: ${DRIVER_PASSWORD:?set DRIVER_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      # Optional: address printed QR codes point to, e.g. https://swingbus.example.com
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - swing-bus-data:/data
    restart: unless-stopped

volumes:
  swing-bus-data:
